<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Jhomar John Picar, Full-Stack and AI Web Developer interactive 3D Rubik's Cube portfolio."
    />
    <title>Jhomar John Picar | Full-Stack Web Developer</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2309090b'/%3E%3Crect x='4' y='4' width='10' height='10' rx='2' fill='%23f59e0b'/%3E%3Crect x='18' y='4' width='10' height='10' rx='2' fill='%231d4ed8'/%3E%3Crect x='4' y='18' width='10' height='10' rx='2' fill='%2315803d'/%3E%3Crect x='18' y='18' width='10' height='10' rx='2' fill='%23c2410c'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('cubefolio-theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch {}
      })();
    </script>
  </head>
  <body class="bg-[#f5f4f0] text-[#111217] dark:bg-[#09090b] dark:text-[#fafafa] antialiased selection:bg-amber-500/30 selection:text-amber-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
